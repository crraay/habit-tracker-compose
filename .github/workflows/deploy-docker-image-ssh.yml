name: deploy-docker-image-ssh

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - backend
          - frontend

concurrency:
  group: deploy-docker-image-ssh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ vars.SERVER_SSH_PORT || 22 }}
          timeout: 2m
          command_timeout: ${{ vars.DEPLOY_SSH_COMMAND_TIMEOUT || '15m' }}
          script: |
            set -euo pipefail
            COMPOSE_DIR='${{ vars.DEPLOY_COMPOSE_DIR || '/app/habit-tracker-compose' }}'
            SERVICE='${{ inputs.service }}'
            if [ ! -d "$COMPOSE_DIR" ]; then
              echo "ERROR: compose directory not found: $COMPOSE_DIR"
              echo "Clone habit-tracker-compose there or set DEPLOY_COMPOSE_DIR."
              exit 1
            fi
            cd "$COMPOSE_DIR"
            git pull --ff-only
            chmod +x scripts/deploy-service.sh
            ./scripts/deploy-service.sh "$SERVICE"
