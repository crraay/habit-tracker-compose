# Production stack: Hub images only. Copy .env.example to .env (see DOCKER.md).
# Project/volume names match the prior backend-repo deploy path so Postgres data survives migration.
name: habit-tracker-springboot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-habit_tracker}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-habit_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  backend:
    image: docker.io/crraay/habit-tracker-springboot:latest
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-habit_tracker}?currentSchema=public
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: docker.io/crraay/habit-tracker-angular:latest
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: habit-tracker-springboot_postgres_data
